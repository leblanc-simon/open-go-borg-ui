# v0.1 acceptance tool, borgui-recette.
recette.usage: |
  Usage: borgui-recette <command> [options]

  Commands:
    generate <folder> [--size <MiB>]      create an acceptance data set
    manifest <folder> [-o <file>]         record the checksums of a folder
    compare <manifest> <folder> [--ignore <path>]  check a restored folder
