# English catalogue. Borg vocabulary is deliberately absent from user-facing
# strings: destination, backup and retention, never repository, archive or
# prune.

cli.usage: |
  Usage: borgui <command> [options]

  Commands:
    config init      create this computer's configuration
    config show      show the configuration
    key show         show the key to register on the destination
    runtime status   backup engine status
    runtime install  install the backup engine
    connection test  check access to the destination
    passphrase set   store the destination password
    repository init  prepare the destination
    repository info  destination status
    backup           run a backup
    archives         list available backups
    restore          restore a backup into a new folder
    history          backup history of this computer
    schedule         set up automatic backup
    retention        how long backups are kept
    state            status of this computer, as stored on its destination

  Common options:
    --config <file>    configuration file to use
    --profile <name>   profile to use
    --lang <language>  message language (fr, en)
