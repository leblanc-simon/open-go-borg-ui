# Outil de recette de la v0.1, borgui-recette.
recette.usage: |
  Utilisation : borgui-recette <commande> [options]

  Commandes :
    generate <dossier> [--size <Mio>]     crée un jeu de données de recette
    manifest <dossier> [-o <fichier>]     établit les empreintes d'un dossier
    compare <manifeste> <dossier>         vérifie un dossier restauré
