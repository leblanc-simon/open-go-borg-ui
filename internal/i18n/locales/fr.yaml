# Catalogue français. Les clés sont en anglais, structurées « écran.élément ».
# Les racines transverses — status, duration, error, encryption — ne sont pas
# dupliquées écran par écran.
#
# Le vocabulaire de Borg n'apparaît pas dans les messages : on dit destination,
# sauvegarde et conservation, jamais dépôt, archive ni rotation (EI-02).

cli.usage: |
  Utilisation : borgui <commande> [options]

  Commandes :
    config init      crée la configuration du poste
    config show      affiche la configuration
    key show         affiche la clé à déposer sur la destination
    runtime status   état du moteur de sauvegarde
    runtime install  installe le moteur de sauvegarde
    connection test  vérifie l'accès à la destination
    passphrase set   enregistre le mot de passe de la destination
    repository init  prépare la destination
    repository info  état de la destination
    backup           lance une sauvegarde
    archives         liste les sauvegardes disponibles
    restore          restaure une sauvegarde dans un dossier neuf
    history          historique des sauvegardes de ce poste
    schedule         règle la sauvegarde automatique
    state            état de ce poste, tel que déposé sur sa destination

  Options communes :
    --config <fichier>   fichier de configuration à utiliser
    --profile <nom>      profil à utiliser
    --lang <langue>      langue des messages (fr, en)
